name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # Provisions the pinned MoSQITo checkout + uv so the Annex B.4 kernel
      # conformance testset (test/test_method2_annexb_conformance.jl) runs
      # instead of self-skipping. Restricted to ubuntu/macos: the test hardcodes
      # POSIX paths (joinpath("/tmp", "mosqito-pinned", ...)), which do not
      # resolve consistently on windows-latest (no native /tmp, and Actions'
      # default pwsh shell doesn't share Git Bash's /tmp mapping), so the clone
      # destination and the path the Julia test looks for could diverge. Windows
      # keeps the visible @test_skip instead of a false pass/fail.
      - name: Clone pinned MoSQITo checkout (Annex B conformance reference material)
        if: matrix.os != 'windows-latest'
        run: |
          git clone https://github.com/Eomys/MoSQITo /tmp/mosqito-pinned
          git -C /tmp/mosqito-pinned checkout d990c33f94f1b2050b2d811dea492219ebe97b30
      - uses: astral-sh/setup-uv@v8.3.2
        if: matrix.os != 'windows-latest'
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
